name: Feature request
description: Suggest a classification, comparison or integration improvement.
title: "[Feature] "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What ticket-classification or model-comparison task should improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you expect and a synthetic example if useful.
    validations:
      required: true
