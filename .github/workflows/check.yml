name: Source and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python scripts/check_public.py --staged
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m unittest discover -s backend -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: npm ci --ignore-scripts
      - run: npm run test:ui
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --audit-level=high
