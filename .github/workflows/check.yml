name: Source and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python scripts/check_public.py --staged
      - run: python -m pip install --require-hashes -r service/requirements.lock
      - run: python -m pip install --require-hashes --index-url https://pypi.org/simple -r service/kaggle.lock
      - run: python -m unittest discover -s backend -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r service/requirements.lock --no-deps --disable-pip
      - run: python -m pip_audit -r service/kaggle.lock --no-deps --disable-pip
      - run: python -m pip_audit -r training/requirements.lock --no-deps --disable-pip
      - run: npm ci --ignore-scripts
      - run: npm run test:ui
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --audit-level=high
