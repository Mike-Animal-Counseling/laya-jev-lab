services:
  web:
    ports: !reset []
  edge:
    image: caddy:2-alpine
    environment:
      SERVICE_DOMAIN: ${SERVICE_DOMAIN:?Set the public hostname}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-data:/data
      - edge-config:/config
    depends_on:
      - web
    restart: unless-stopped
volumes:
  edge-data:
  edge-config:
